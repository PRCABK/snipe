name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: false
        default: "0.1.0"

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build Installer & Release (Windows x64)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Inno Setup
        run: |
          choco install innosetup -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Tests
        run: cargo test --workspace --release

      - name: Build Release Binary
        run: cargo build --workspace --release

      - name: Package with Inno Setup
        shell: pwsh
        run: |
          ./scripts/package.ps1

      - name: Generate Checksums
        shell: pwsh
        run: |
          cd dist
          Get-FileHash -Algorithm SHA256 * | ForEach-Object {
            "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)"
          } | Out-File -Encoding utf8 SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Upload Artifacts (Dispatch or Tag)
        uses: actions/upload-artifact@v4
        with:
          name: snipe-windows-x64-dist
          path: dist/*
