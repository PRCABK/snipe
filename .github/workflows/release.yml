name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: false
        default: "0.1.1-alpha.3"

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build Installer & Release (Windows x64)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Resolve and validate release version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = "${{ inputs.version }}".TrimStart("v")
          }
          $manifest = Get-Content -LiteralPath Cargo.toml -Raw
          $match = [regex]::Match($manifest, '(?ms)^\[workspace\.package\].*?^version\s*=\s*"([^"]+)"')
          if (!$match.Success -or $match.Groups[1].Value -ne $version) {
            throw "Release version '$version' does not match Cargo.toml workspace version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        run: |
          choco install innosetup -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Verify committed dependency lockfile
        run: cargo metadata --locked --format-version 1 --no-deps > $null

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run Tests
        run: cargo test --workspace --release --locked

      - name: Package with Inno Setup
        shell: pwsh
        run: |
          ./scripts/package.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Generate Checksums
        shell: pwsh
        run: |
          cd dist
          Get-FileHash -Algorithm SHA256 * | ForEach-Object {
            "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)"
          } | Out-File -Encoding utf8 SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*
          draft: false
          prerelease: true
          generate_release_notes: true

      - name: Upload Artifacts (Dispatch or Tag)
        uses: actions/upload-artifact@v4
        with:
          name: snipe-windows-x64-dist
          path: dist/*
