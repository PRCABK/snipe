[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "snipe"
path = "src/main.rs"

[dependencies]
domain = { workspace = true }
config = { workspace = true }
secure-storage-windows = { workspace = true }
capture-core = { workspace = true }
capture-windows = { workspace = true }
imaging = { workspace = true }
annotation = { workspace = true }
longshot = { workspace = true }
ai-client = { workspace = true }
ui-slint = { workspace = true }

tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
slint = { workspace = true }
dirs = "5.0"
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58.0", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_Security",
] }

[build-dependencies]
winresource = "0.1"
